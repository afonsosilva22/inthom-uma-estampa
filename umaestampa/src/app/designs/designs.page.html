<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title color="orange"><strong>Uma Estampa</strong></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- SUB HEADER -->
  <ion-toolbar>
    <ion-title color="dark" size="large"><strong>Os meus designs</strong></ion-title>
    <ion-buttons slot="end" *ngIf="displayDesigns.length > 0">
      <ion-button shape="round" routerLink="/create-design" class="new-design-btn">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Criar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- NÃO EXISTEM DESIGNS -->
  <div *ngIf="displayDesigns.length === 0" class="empty-state">
    <div class="empty-icon">
      <ion-icon name="eye-outline"></ion-icon>
    </div>
    <h3>Ainda não tens designs</h3>
    <ion-button routerLink="/create-design" color="orange" expand="block" shape="round">
      Criar Design
    </ion-button>
  </div>

  <!-- DISPLAY DE DESIGNS -->
  <ion-grid *ngIf="displayDesigns.length > 0" class="designs-grid">
    <ion-row>
      <ion-col *ngFor="let item of displayDesigns" size="12" size-md="6" size-lg="4">
        <ion-card class="design-card" [class.deleting]="deletingId === item.design.id">

          <!-- IMAGEM -->
          <div class="design-preview">
            <!-- Imagem base do produto na cor da variante -->
            <img class="product-layer" [src]="item.variant.imageUrl" [alt]="item.product.name" />
            <!-- Imagem do utilizador por cima, só aparece se existir -->
            <img *ngIf="item.design.uploadedImageUrl" class="design-layer" [src]="item.design.uploadedImageUrl" [alt]="item.product.name" />

            <ion-badge *ngIf="item.design.isPublic" color="success" class="public-badge" style="color: white;">
              Público
            </ion-badge>
          </div>

          <!-- CONTEÚDO -->
          <ion-card-content class="card-body">
            <h3 class="design-title">{{ item.product.name }}</h3>

            <div class="design-meta">
              <span class="color-swatch" [style.background-color]="item.variant.color"></span>
              <span>{{ item.variant.colorName }}</span>
              <span class="dot">•</span>
              <span>{{ item.design.size }}</span>
              <span class="dot">•</span>
              <span class="price">{{ getPrice(item).toFixed(2) }}€</span>
            </div>

            <!-- AÇÕES -->
            <div class="action-row">
              <ion-button fill="solid" size="small" color="orange" (click)="handleOrder(item)" title="Encomendar">
                <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
              </ion-button>

              <ion-button fill="outline" size="small" color="medium" (click)="handleEdit(item)" title="Editar">
                <ion-icon slot="icon-only" name="create-outline"></ion-icon>
              </ion-button>

              <ion-button
                fill="outline"
                size="small"
                color="medium"
                (click)="handleTogglePublic(item.design.id, item.design.isPublic)"
                [title]="item.design.isPublic ? 'Tornar privado' : 'Tornar público'">
                <ion-icon slot="icon-only" [name]="item.design.isPublic ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>

              <ion-button
                fill="outline"
                size="small"
                color="danger"
                (click)="handleDelete(item.design.id)"
                [disabled]="deletingId === item.design.id"
                title="Eliminar">
                <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
